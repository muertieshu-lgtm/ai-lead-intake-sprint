<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Intake Flow</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="intro">
        <p class="eyebrow">Live demo</p>
        <h1>Service consultation intake</h1>
        <p>
          This sample shows the kind of qualification flow shipped in the AI Lead Intake Sprint:
          questions, lead summary, and CRM-ready details.
        </p>
      </section>

      <section class="panel">
        <div class="chat" id="chat" aria-live="polite"></div>
        <form id="intake-form">
          <label>
            What service are you looking for?
            <select name="service" required>
              <option value="">Choose one</option>
              <option>Buying a home</option>
              <option>Selling a home</option>
              <option>Immigration consultation</option>
              <option>Med spa consultation</option>
            </select>
          </label>

          <label>
            How soon do you want to start?
            <select name="timeline" required>
              <option value="">Choose one</option>
              <option>This week</option>
              <option>This month</option>
              <option>1-3 months</option>
              <option>Just researching</option>
            </select>
          </label>

          <label>
            What should the business know before contacting you?
            <textarea name="details" rows="4" placeholder="Budget, location, questions, or context"></textarea>
          </label>

          <label>
            Email
            <input name="email" type="email" placeholder="you@example.com" required />
          </label>

          <button type="submit">Generate lead summary</button>
        </form>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
